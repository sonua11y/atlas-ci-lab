
name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy-check:
    name: Deployment configuration check
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployment secret
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "APP_TOKEN secret is missing."
            exit 1
          fi
          echo "Deployment configuration check passed."
